<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>All Work - Wjerk: A Climate Design Studio</title>
  <meta name="description"
    content="Every Wjerk project from 2003 to now, newest first: books, identities, websites, objects and more.">
  <link rel="stylesheet" href="./style.css">
</head>

<!-- The list below is generated by works.js at build time from works.json
     (written by the hand-run works-sync.js from Notion; see CLAUDE.md). The
     source keeps the literal token. No logo in the header, like
     images.html: this page is a text index and loads no images. -->

<body class="case-study worksIndex">

  <header>
    <div class="blurb">
      <p><strong>Wjerk.</strong> <small>A Climate Design Studio. <small>Designing for the Welfare of All
            Life.<sup>‡</sup></small></small></p>
    </div>
    <nav>
      <ul class="listReset">
        <li><a href="index.html#work">Case Studies</a></li>
        <li><a href="works.html" aria-current="page">All Work</a></li>
        <li><a href="index.html#contact">Contact</a></li>
        <li><a href="https://bjornpaedia.wjerk.shop/">Notes &amp; Ideas</a></li>
        <li><a href="https://stuff.wjerk.shop/">Store</a></li>
        <li><a href="https://buttondown.com/bjornmeansbear">Newsletter</a></li>
      </ul>
    </nav>

  </header>

  <main>
    <section class="caseStudyDetail">
      <div class="content">
        <h1>All Work</h1>
        <p class="dek">Every project from 2003 to now, newest first.</p>
      </div>
    </section>

    <article class="worksBody" id="works">
      <!-- Search needs list.js; until it loads it stays hidden and the full
           table below is the page. -->
      <div class="worksControls" hidden>
        <label for="worksSearch">Search all %WORKS_COUNT% projects</label>
        <input class="search" id="worksSearch" type="search" placeholder="A title, a kind, a client…">
        <p class="worksStatus" aria-live="polite"></p>
      </div>

      %WORKS%
    </article>
    <nav class="caseNav">
      <a class="backLink" href="index.html">← Back to the homepage</a>
    </nav>
  </main>

  <footer>
    %FOOTER%
  </footer>

  <script src="vendor/list.min.js"></script>
  <script>
  (function () {
    // No library, no filtering: the full newest-first list stays on show,
    // the same page a visitor with scripts off gets.
    if (typeof List === "undefined") return;
    var box = document.getElementById("works");
    var controls = box.querySelector(".worksControls");
    var input = box.querySelector(".search");
    var status = box.querySelector(".worksStatus");
    var list = new List("works", {
      listClass: "worksList",
      valueNames: ["title", "kind", "years", "oneLiner", "credits", { data: ["when"] }]
    });
    controls.hidden = false;

    // Sortable headers become buttons. First click on Year sorts newest
    // first, on Title or Kind A–Z; clicking the current one flips it.
    // aria-sort lives on the header, where screen readers announce it.
    // Rows with no kind (or no value) go last either way round — list.js
    // flips the result for "desc", so undo that for the empties. Ties fall
    // back to newest first.
    function byField(a, b, opts) {
      var f = opts.valueName, x = a.values()[f] || "", y = b.values()[f] || "";
      var flip = opts.order === "desc" ? -1 : 1;
      if (!x !== !y) return (x ? -1 : 1) * flip;
      return x.localeCompare(y, undefined, { numeric: true }) ||
        (b.values().when || "").localeCompare(a.values().when || "") * flip;
    }

    var heads = box.querySelectorAll("th[data-sort]");
    heads.forEach(function (th) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = th.textContent;
      th.textContent = "";
      th.appendChild(b);
      b.addEventListener("click", function () {
        var cur = th.getAttribute("aria-sort");
        var first = th.dataset.sort === "when" ? "descending" : "ascending";
        var next = cur ? (cur === "ascending" ? "descending" : "ascending") : first;
        list.sort(th.dataset.sort, { order: next === "ascending" ? "asc" : "desc", sortFunction: byField });
        heads.forEach(function (h) { h.removeAttribute("aria-sort"); });
        th.setAttribute("aria-sort", next);
      });
    });

    function update() {
      var searching = input.value.trim() !== "";
      var n = list.matchingItems.length;
      status.textContent = searching ? n + (n === 1 ? " project matches" : " projects match") : "";
    }
    list.on("searchComplete", update);
  })();
  </script>

</body>

</html>
