  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: rgb(8,5,4); color: rgb(251,245,242);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  /* The stage centres its one in-flow child, the text panel. The image
     layers and the caption are absolutely positioned, so they sit outside
     this centring and keep their own placement. */
  #stage {
    position: relative; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  /* Two stacked layers so the next chair is decoded before it is shown --
     a hard cut to a half-decoded image reads as a flicker. No transition:
     the chairs switch, they do not fade. */
  .layer {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    visibility: hidden;
  }
  .layer.on { visibility: visible; }
  .layer img { display: block; width: 100vw; height: 100vh; object-fit: contain; }

  #caption {
    position: absolute; left: 0; bottom: 0; z-index: 3;
    max-width: 46vw; padding: 1.5vh 2.2vw;
    font-size: clamp(14px, 1.6vw, 22px); line-height: 1.35;
    letter-spacing: 0.02em;
    color: rgb(192,185,181); background: rgb(8,5,4);
  }
  #caption:empty { display: none; }
  #caption .credit {
    display: block; margin-top: 0.35em;
    font-size: 0.8em; color: rgb(158,151,147);
  }
  /* The panel owns the frame while it is up; the caption returns after. */
  #stage.texting #caption { opacity: 0; }
  #caption { transition: opacity 400ms ease; }

  /* The text panel rides over the running chairs on its own opaque ground,
     so contrast holds whatever is behind it. Size comes from the length of
     the quote: a short line covers a corner, a long passage covers most of
     the screen. */
  /* A centred card, in flow, shrink-wrapped to its text -- so how much of the
     frame it covers comes from the length of the quote rather than from a
     fixed footprint. */
  #overlay {
    position: relative; z-index: 4;
    /* A fresh tilt on every new quote, the way oblique tosses a new strategy
       card onto the table -- you register that it changed before you read it. */
    transform: rotate(var(--card-rotation, 0deg));
    background: rgb(8,5,4);
    padding: 4vh 4vw;
    opacity: 0; transition: opacity 700ms ease;
    display: flex; flex-direction: column; justify-content: center;
    text-align: center;
    height: fit-content;
    pointer-events: none;
  }
  #overlay.on { opacity: 1; }
  #overlay .quote {
    white-space: pre-line; margin: 0;
    /* Never let an unbroken run (a URL, a long compound) push past the card. */
    overflow-wrap: break-word;
    line-height: 1.22; letter-spacing: -0.01em;
  }
  #overlay .attribution {
    margin: 1.6rem 0 0; font-size: clamp(14px, 1.4vw, 20px);
    color: rgb(255,129,169);
  }
  /* Three footprints, picked by quote length. The card is centred and in
     flow, so width and type size are what vary -- a short line takes a small
     card, a long passage takes most of the frame. */
  .sz-s { max-width: 44vw; }
  .sz-s .quote { font-size: clamp(20px, 2.4vw, 38px); }
  .sz-m { max-width: 68vw; }
  .sz-m .quote { font-size: clamp(22px, 3.0vw, 46px); }
  .sz-l { max-width: 88vw; }
  .sz-l .quote { font-size: clamp(22px, 3.2vw, 52px); }

  #chrome {
    position: fixed; right: 2.2vw; bottom: 2.2vh; z-index: 5;
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.5vh;
    opacity: 1; transition: opacity 1.5s ease;
  }
  #chrome.hidden { opacity: 0; }
  #chrome:focus-within { opacity: 1; }
  #home, #credit, #hint {
    font-size: 13px; letter-spacing: 0.04em;
    background: rgb(8,5,4); padding: 0.6vh 1vw;
  }
  #home, #credit { color: rgb(192,185,181); }
  #hint { color: rgb(158,151,147); }
  #home a, #credit a { color: rgb(255,129,169); text-decoration: underline; text-underline-offset: 2px; }
  #home a:focus-visible, #credit a:focus-visible { outline: 2px solid rgb(255,129,169); outline-offset: 3px; }
  #paused-badge {
    position: fixed; top: 2.2vh; right: 2.2vw; z-index: 5;
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgb(158,151,147); background: rgb(8,5,4); padding: 0.6vh 1vw;
    opacity: 0; transition: opacity 300ms ease;
  }
  #paused-badge.visible { opacity: 1; }

  /* A 1.2s hard cut is a lot of motion. Anyone who has asked their system to
     reduce it gets a slow, calm version instead of an opt-out. */
  @media (prefers-reduced-motion: reduce) {
    #overlay { transition: none; }
  }
</style>

const TEXTS  = [{"text": "Chair-ness", "attribution": ""}, {"text": "Does the chair afford sitting?", "attribution": ""}, {"text": "If you borrow from a certain style, it’s important to know where that style came from, as well as the social and cultural contexts that gave that style its rise.", "attribution": ""}, {"text": "What is a chair?", "attribution": ""}, {"text": "A chair is a human-made object which perhaps defines the human as-such.", "attribution": "Dror Pimentel, “Beuys’ Chair and the Violence of the Other”"}, {"text": "Strip away style, material, and history, and you get “chair-ness” — a seat, a back, a place to rest.", "attribution": ""}, {"text": "“Chair-ness” as a Platonic ideal is simple; it’s also endlessly adaptable.", "attribution": ""}, {"text": "A chair is a human object, since only humans can sit. Only humans can sit, since only humans can stand. By way of negation, the chair therefore testifies to the uprightness of humans.", "attribution": "Dror Pimentel, “Beuys’ Chair and the Violence of the Other”"}, {"text": "A designed object for sitting, typically with a seat, back, and often legs.", "attribution": ""}, {"text": "The essential qualities that make something a chair, regardless of style, material, or context — function (to support a seated body), structure (a surface to sit on), intention (provide respite).", "attribution": ""}, {"text": "There is no chair that two see together. I think it is possible to see a chair as it is. But when you burn the chair, you suddenly realize that the chair in your head did not burn or disappear.", "attribution": "Yoko Ono"}, {"text": "Chair-ness is flexible: it can be found in a throne, a log, a plastic patio chair, or a designer’s experiment. What unites them is their purpose — to support sitting.", "attribution": ""}, {"text": "Chair-ness is an adaptable ideal: the form, content, and context of a chair can vary endlessly.", "attribution": ""}, {"text": "Every chair exists at the intersection of form (what it is), content (what it does or means), and context (where, why, when, and how it exists).", "attribution": ""}, {"text": "A work of art exists as itself; a chair exists as a chair itself.", "attribution": "Donald Judd, 1993"}, {"text": "What actually constitutes a chair? chair-ness?", "attribution": ""}, {"text": "How do you know when you’ve made a chair?", "attribution": ""}, {"text": "What’s a chair actually for?", "attribution": ""}, {"text": "How little material can you use and still have a chair?", "attribution": ""}, {"text": "Is a stool a chair? Is a bench a chair?", "attribution": ""}, {"text": "A chair is just a chair, but they can also be so much more.", "attribution": ""}, {"text": "Few chairs will be design classics. That’s not a failure of ambition.", "attribution": ""}, {"text": "A notable chair perhaps starts to answer “why a chair.” The many un-notable ones start to provide a clear collective answer as to “what is a chair.”", "attribution": ""}, {"text": "A chair is a very difficult object. A skyscraper is almost easier. That’s why Chippendale is famous.", "attribution": "Mies van der Rohe (attributed)"}, {"text": "Everyone has a favorite chair.", "attribution": ""}, {"text": "There’s no one right chair for everyone, but there is, perhaps, a Platonic ideal.", "attribution": ""}, {"text": "They’re meant to be functional, serviceable furniture.", "attribution": ""}, {"text": "The idea of a chair isn’t a chair.", "attribution": "Donald Judd, 1993"}, {"text": "Chair-ness is a platonic ideal that can manifest through many materials, traditions, localities, aesthetics, and styles.", "attribution": ""}, {"text": "What kind of a society is it when you can’t even buy a chair?", "attribution": "Donald Judd, 1993"}, {"text": "Three guidelines, no exceptions: it has to be functional, it has to be safe, and it has to be finished in a single work session.", "attribution": "(Chair-ness the project)"}, {"text": "The mark is a wireframe suggesting a chair with most of the material stripped away.", "attribution": ""}, {"text": "The good chair is a task one is never completely done with.", "attribution": "Hans Wegner"}, {"text": "Chairs are a wonderful Venn-diagram crossover of function, fun, craftsmanship, design, and art.", "attribution": ""}, {"text": "Craftspeople have been trying to realize that idealized, perfect chair out of bent wood, plastic, metal tubing, textiles, and stones for centuries.", "attribution": ""}, {"text": "Nothing is constant in chairs except that they offer an invitation to repose.", "attribution": ""}, {"text": "They are often the first important design object that new ideas — whether about materials, production, or social ideology — hang off of.", "attribution": ""}, {"text": "We smile at the chair and the chair smiles back.", "attribution": "Naoto Fukasawa"}, {"text": "Not every chair is a good chair from a design perspective, but every chair is a functional chair that you can safely sit in.", "attribution": ""}, {"text": "Chairs follow the human body; they cradle and support it.", "attribution": ""}, {"text": "Chairs have become almost totemic objects of desire. Sometimes they slip into the world of fine art over function — does that make them less of a chair?", "attribution": ""}, {"text": "Why would I want furniture from a century that was mid?", "attribution": "Eaton Print Shop"}, {"text": "Construction is simple, connection methods visible. The forms can be rough, crude, or vulgar. The goal is a chair that is safe to sit in and ready to use by the end of the session.", "attribution": ""}, {"text": "Utilitarian, pragmatic, ad hoc. They should reward and entertain the sitter.", "attribution": ""}, {"text": "Complicated isn’t the opposite of simple. Simple can still be complex.", "attribution": ""}, {"text": "Chairs combine historical significance, general familiarity, and technical complexity in one human-sized form.", "attribution": ""}, {"text": "A deceptively simple object, and repeatedly a catalyst for stylistic and industrial change.", "attribution": ""}, {"text": "Chairs reflect their era’s technological prowess and its philosophical underpinnings.", "attribution": ""}, {"text": "In the words of Le Corbusier, the chair is thus turned into a “sitting machine,” destined to fulfil its function and nothing more. Comfort is therefore sacrificed for the sake of functionality.", "attribution": "Dror Pimentel, “Beuys’ Chair and the Violence of the Other”"}, {"text": "Everyone uses a chair. That ubiquity makes supply chains, material sourcing, and lifecycle impacts relatable.", "attribution": ""}, {"text": "Despite their humble scale, chairs are produced in quantities large enough to raise real questions about their environmental footprint.", "attribution": ""}, {"text": "People get attached to chairs that are comfortable, and to chairs that belonged to someone who mattered to them.", "attribution": ""}, {"text": "Is stool-ness a subset of chair-ness?", "attribution": ""}, {"text": "One form, three materials: aluminum, recycled bottles, Amish-cut wood. The Navy Chair stayed the Navy Chair.", "attribution": ""}, {"text": "The No. 14 shipped flat, in parts, in 1859. The chair carried the method.", "attribution": ""}, {"text": "Meindertsma’s Flax Chair is one plant, start to finish.", "attribution": ""}, {"text": "The chair has been used for design innovations — a tangible manifesto for prevailing technologies, aesthetics, and social movements.", "attribution": ""}, {"text": "Chair-ness is a Platonic ideal: a perfect, abstract form that exists in thought, with every physical chair an imperfect manifestation.", "attribution": ""}, {"text": "The Emeco Navy Chair is a micro-case study of form versus material — a single form adapting through different material narratives and local production methods.", "attribution": ""}, {"text": "Emeco’s 111 Navy Chair is crafted from 111 recycled Coke bottles to sequester plastic waste.", "attribution": ""}, {"text": "Michael Thonet’s No. 14 bentwood chair pioneered mass production and flat-pack shipping in the mid-19th century.", "attribution": ""}, {"text": "Christien Meindertsma’s Flax Chair showcases a single plant’s versatile applications.", "attribution": ""}, {"text": "Sebastian Cox’s Products of Silviculture chair emerged directly from regenerative woodlands, blurring the lines between forestry and furniture.", "attribution": ""}];
const MAX_UPSCALE = 2.5;
const QUOTE_FONTS = ["Basteleur", "Space Grotesk", "Cormorant Garamond", "Work Sans", "Sligoil Micro", "Libre Franklin"];
const BASE_STACK = '-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif';

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
// Chairs switch this fast; a text panel arrives after this many chairs.
const IMAGE_MS = reduce ? 5000 : 600;
const CHAIRS_BETWEEN_TEXT = 7;
const MAX_TILT = 7.0;

const layers = [document.getElementById('layer0'), document.getElementById('layer1')];
const capEl = document.getElementById('caption');
const overlay = document.getElementById('overlay');
const badge = document.getElementById('paused-badge');
const chrome_ = document.getElementById('chrome');

const stageEl = document.getElementById('stage');
let li = 0, ii = 0, ti = 0, sinceText = 0, paused = false;
let imgTimer = null, textTimer = null;
// When the current panel is due down, and how long was left on it when the
// show was suspended. Both timers must be re-armed together on resume: the
// panel blocks new quotes while it is up, so a hide timer that is cleared and
// never replaced stalls the quotes permanently while the chairs keep cycling.
let textHideAt = 0, textRemaining = 0;

function applySize(el, s) {
  if (s.w && s.h) {
    el.style.maxWidth = (s.w * MAX_UPSCALE) + 'px';
    el.style.maxHeight = (s.h * MAX_UPSCALE) + 'px';
  } else {
    el.style.maxWidth = el.style.maxHeight = '';
  }
}

// Warm the next few so a hard cut lands on a decoded image.
function warm(from) {
  for (let n = 1; n <= 6; n++) new Image().src = IMAGES[(from + n) % IMAGES.length].src;
}

function showImage(i) {
  const s = IMAGES[i];
  const back = layers[1 - li];
  const img = back.querySelector('img');
  const swap = () => {
    layers[li].classList.remove('on');
    back.classList.add('on');
    li = 1 - li;
    capEl.textContent = s.caption || '';
    if (s.credit) {
      const cr = document.createElement('span');
      cr.className = 'credit';
      cr.textContent = s.credit;
      capEl.appendChild(cr);
    }
  };
  img.onload = swap;
  img.onerror = () => { step(); };   // skip a source that will not load
  applySize(img, s);
  img.src = s.src;
  warm(i);
}

function step() {
  ii = (ii + 1) % IMAGES.length;
  showImage(ii);
  // Only count chairs shown with nothing over them. Counting during a panel
  // spends the gap while the text is still up, so the next panel fires the
  // moment the last one hides and the chairs never get the screen to
  // themselves -- which also means the caption never becomes visible.
  if (overlay.classList.contains('on')) {
    // Safety net: if a panel has outlived its hide time by a wide margin,
    // something dropped its timer. Take it down rather than wedge the show.
    if (textHideAt && Date.now() > textHideAt + 5000) hidePanel();
    return;
  }
  sinceText++;
  if (sinceText >= CHAIRS_BETWEEN_TEXT) showText();
}

function textSeconds(t) {
  const chars = (t.text || '').length + (t.attribution || '').length;
  return Math.max(6.0, Math.min(16.0,
                  3.5 + chars / 18.0));
}

function showText() {
  if (!TEXTS.length) return;
  const t = TEXTS[ti % TEXTS.length];
  const n = (t.text || '').length;
  const size = n < 60 ? 'sz-s' : n < 140 ? 'sz-m' : 'sz-l';
  overlay.className = size;
  // -7deg to +7deg, same range oblique uses.
  overlay.style.setProperty('--card-rotation',
    (Math.random() * 2 * MAX_TILT - MAX_TILT).toFixed(2) + 'deg');
  overlay.innerHTML = '';
  const q = document.createElement('p');
  q.className = 'quote';
  q.textContent = t.text;
  if (QUOTE_FONTS.length) {
    q.style.fontFamily = "'" + QUOTE_FONTS[ti % QUOTE_FONTS.length] + "', " + BASE_STACK;
  }
  overlay.appendChild(q);
  if (t.attribution) {
    const a = document.createElement('p');
    a.className = 'attribution';
    a.textContent = '— ' + t.attribution;
    overlay.appendChild(a);
  }
  requestAnimationFrame(() => {
    overlay.classList.add('on');
    stageEl.classList.add('texting');
  });
  ti++; sinceText = 0;
  const ms = textSeconds(t) * 1000;
  textHideAt = Date.now() + ms;
  armHide(ms);
}

function hidePanel() {
  overlay.classList.remove('on');
  stageEl.classList.remove('texting');
  textHideAt = 0;
}

function armHide(ms) {
  clearTimeout(textTimer);
  textTimer = setTimeout(hidePanel, Math.max(0, ms));
}

// Freeze both tracks together, keeping whatever was left on the panel.
function suspend() {
  clearInterval(imgTimer); imgTimer = null;
  if (textHideAt) textRemaining = Math.max(0, textHideAt - Date.now());
  clearTimeout(textTimer); textTimer = null;
}

function resume() {
  run();
  if (textHideAt) {
    textHideAt = Date.now() + textRemaining;
    armHide(textRemaining);
  }
}

function run() {
  clearInterval(imgTimer);
  if (paused) return;
  imgTimer = setInterval(step, IMAGE_MS);
}

function setPaused(v) {
  paused = v;
  badge.classList.toggle('visible', paused);
  if (paused) suspend(); else resume();
}

document.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
  else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) suspend();
  else if (!paused) resume();
});

let chromeTimer = setTimeout(() => chrome_.classList.add('hidden'), 6000);
function wakeChrome() {
  chrome_.classList.remove('hidden');
  clearTimeout(chromeTimer);
  chromeTimer = setTimeout(() => chrome_.classList.add('hidden'), 4000);
}
document.addEventListener('mousemove', wakeChrome);
document.addEventListener('focusin', wakeChrome);

showImage(0);
run();
</script>
