<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>{{TITLE}} - Wjerk: A Climate Design Studio</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="case-study">

  <header>
    <div class="logo">
      <img src="i/alternateEarthRingsLogo.webp" alt="Gray Earth Marble with Rings of Hope radiating outward" />
    </div>
    <div class="blurb">
      <p><strong>Wjerk.</strong> <small>A Climate Design Studio. <small>Designing for the Welfare of All
            Life.<sup>‡</sup></small></small></p>
    </div>
    <nav>
      <ul class="listReset">
        <li><a href="index.html#work">Case Studies</a></li>
        <li><a href="index.html#contact">Contact</a></li>
        <li><a href="https://bjornpaedia.wjerk.shop/">Notes &amp; Ideas</a></li>
        <li><a href="https://stuff.wjerk.shop/">Store</a></li>
        <li><a href="https://buttondown.com/bjornmeansbear">Newsletter</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="caseStudyDetail">
      <div class="imageWrapper">
        <img src="{{IMAGE}}" alt="{{TITLE}}" loading="lazy" decoding="async">
      </div>
      <div class="content">
        <h1>{{TITLE}}</h1>
        <!--
          Before you write: what’s the concrete proof this wasn’t just a concept?
          A real client, a number, a "still running" fact. State it in the first
          paragraph after the dek — before any process or method detail. Readers
          bounce off craft specifics before they reach the outcome if it’s buried.

          Dek: the real question this project answers, not a summary of what it is.
          Then: the proof (see above).
          Then: the story — problem, method, what got built.
          Close: one flat, compressed line. Not a call to action.

          If this case study has 3+ photos, wrap the prose below in
          <div class="caseStudyText"> and the figures in <div class="caseStudyGallery">
          — that triggers the two-column desktop layout automatically. Fewer than
          3 photos (or none), skip both wrapper divs.
        -->
        <p class="dek">{{DESCRIPTION}}</p>
        %ELSEWHERE%
        <!-- Add detailed content here -->
        <p>More details coming soon...</p>
      </div>
    </section>
    <a class="backLink" href="index.html#work">← Back to Case Studies</a>
  </main>

  <footer>
    %FOOTER%
  </footer>

</body>

</html>
